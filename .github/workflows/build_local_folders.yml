name: Build Local Folders APK

on:
  push:
    branches: [feat/local-folders]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew --console=plain :app:assembleFossDebug -x lint
        env:
          PULL_REQUEST: "false"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: meld-local-folders-apk
          path: app/build/outputs/apk/**/*.apk
