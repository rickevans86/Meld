name: Build and Release

# Every push to the feature branch (or a manual run) builds the app and publishes it as a
# GitHub release named after its version, which is where the in-app updater looks.
on:
  push:
    branches: [feat/local-folders]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Updates only install over the app when every build is signed with the same key.
      # The key comes from the DEBUG_KEYSTORE_BASE64 secret; if that is missing or unreadable,
      # a key generated on the first run is kept in the Actions cache instead
      # (GitHub clears the cache after 7 days without a build).
      - name: Read signing key from secret
        id: secret-key
        env:
          KEYSTORE_SECRET: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/meld-signing
          if [ -z "$KEYSTORE_SECRET" ]; then
            echo "usable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_SECRET" | tr -cd 'A-Za-z0-9+/=' > ~/meld-signing/secret.b64
          echo "Secret has $(wc -c < ~/meld-signing/secret.b64) base64 characters (expected 3536)."
          if base64 -d ~/meld-signing/secret.b64 > ~/meld-signing/secret.keystore 2>/dev/null &&
             keytool -list -keystore ~/meld-signing/secret.keystore -storepass android -alias androiddebugkey > /dev/null 2>&1; then
            echo "Key from secret OK: $(sha256sum ~/meld-signing/secret.keystore | cut -c1-12)"
            cp ~/meld-signing/secret.keystore ~/meld-signing/fork.keystore
            echo "usable=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The DEBUG_KEYSTORE_BASE64 secret isn't a readable key (it may have been cut short when pasted). Using the cached key for now; paste the secret again."
            echo "usable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore cached signing key
        if: steps.secret-key.outputs.usable != 'true'
        uses: actions/cache@v4
        with:
          path: ~/meld-signing/fork.keystore
          key: meld-fork-signing-key-v1

      - name: Prepare signing key
        run: |
          if [ ! -f ~/meld-signing/fork.keystore ]; then
            echo "Generating a signing key and caching it."
            keytool -genkeypair -keystore ~/meld-signing/fork.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Meld fork,O=Meld,C=AU"
          fi
          echo "METROLIST_DEBUG_KEYSTORE_PATH=$HOME/meld-signing/fork.keystore" >> "$GITHUB_ENV"

      - name: Work out version
        run: |
          base=$(grep -oP 'versionName = "\K[0-9.]+' app/build.gradle.kts | head -1)
          echo "VERSION=$base.${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "FORK_BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"

      # Retries once, since a dependency download occasionally fails for a moment
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --console=plain :app:assembleFossDebug -x lint || {
            echo "::warning::Build failed; retrying once in case it was a download hiccup."
            sleep 30
            ./gradlew --console=plain --refresh-dependencies :app:assembleFossDebug -x lint
          }
        env:
          PULL_REQUEST: "false"
          METROLIST_APP_NAME: Wavelength

      - name: Collect APK
        run: |
          apk=$(find app/build/outputs/apk -name '*.apk' | grep -i foss | head -1)
          [ -n "$apk" ] || { echo "No APK produced"; exit 1; }
          cp "$apk" Meld.apk

      - name: Upload APK to the run
        uses: actions/upload-artifact@v6
        with:
          name: meld-${{ env.VERSION }}
          path: Meld.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -1 --format='%s%n%n%b' > notes.md
          gh release create "v$VERSION" Meld.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "$VERSION" \
            --notes-file notes.md
