name: Build and Release

# Every push to the feature branch (or a manual run) builds the app and publishes it as a
# GitHub release named after its version, which is where the in-app updater looks.
on:
  push:
    branches: [feat/local-folders]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_KEYSTORE_SECRET: ${{ secrets.DEBUG_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Updates only install over the app when every build is signed with the same key.
      # The key comes from the DEBUG_KEYSTORE_BASE64 secret; without it, one generated on the
      # first run is kept in the Actions cache (which GitHub clears after 7 unused days).
      - name: Restore cached signing key
        id: key-cache
        if: env.HAS_KEYSTORE_SECRET != 'true'
        uses: actions/cache@v4
        with:
          path: ~/meld-signing/fork.keystore
          key: meld-fork-signing-key-v1

      - name: Prepare signing key
        env:
          KEYSTORE_SECRET: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/meld-signing
          if [ -n "$KEYSTORE_SECRET" ]; then
            echo "$KEYSTORE_SECRET" | base64 -d > ~/meld-signing/fork.keystore
          elif [ ! -f ~/meld-signing/fork.keystore ]; then
            echo "::warning::No DEBUG_KEYSTORE_BASE64 secret; generating a signing key and caching it."
            keytool -genkeypair -keystore ~/meld-signing/fork.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Meld fork,O=Meld,C=AU"
          fi
          echo "METROLIST_DEBUG_KEYSTORE_PATH=$HOME/meld-signing/fork.keystore" >> "$GITHUB_ENV"

      - name: Work out version
        run: |
          base=$(grep -oP 'versionName = "\K[0-9.]+' app/build.gradle.kts | head -1)
          echo "VERSION=$base.${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "FORK_BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build APK
        run: chmod +x gradlew && ./gradlew --console=plain :app:assembleFossDebug -x lint
        env:
          PULL_REQUEST: "false"

      - name: Collect APK
        run: |
          apk=$(find app/build/outputs/apk -name '*.apk' | grep -i foss | head -1)
          [ -n "$apk" ] || { echo "No APK produced"; exit 1; }
          cp "$apk" Meld.apk

      - name: Upload APK to the run
        uses: actions/upload-artifact@v6
        with:
          name: meld-${{ env.VERSION }}
          path: Meld.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -1 --format='%s%n%n%b' > notes.md
          gh release create "v$VERSION" Meld.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "$VERSION" \
            --notes-file notes.md
